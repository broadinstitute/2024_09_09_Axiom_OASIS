[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Pipeline and paper tests run under separate locked Pixi environments with
# the unittest commands documented in paper/README.md.
testpaths = [
    "image_archive/tests",
]
markers = [
    "slow: marks tests as slow (deselect with '--runslow \"run slow\"')",
    "serial",
]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff]
line-length = 120
